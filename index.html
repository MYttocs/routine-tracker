<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Routine Tracker</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Routine" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
</head>
<body>
<main id="app">

  <header class="top">
    <h1 id="day-title">Today</h1>
  </header>

  <nav class="strip" aria-label="Choose a day">
    <div class="weeks" id="weeks"></div>
    <p class="legend" aria-hidden="true">
      <span><i class="mark exfoliant"></i>BHA</span>
      <span><i class="mark retinoid"></i>Serum</span>
      <span><i class="mark hair"></i>Hair mask</span>
    </p>
  </nav>

  <section id="track" class="section">
    <h2>Track</h2>
    <div id="track-cards" class="cards"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>History</h2>
      <button id="go-today" class="go-today" type="button" hidden>Back to today</button>
    </div>
    <div id="history-cards" class="cards"></div>
    <button id="add-forgot" class="add-forgot" type="button" hidden>+ Add something I forgot</button>
  </section>

</main>

<div id="sheet" class="sheet-root" aria-hidden="true">
  <div class="sheet-backdrop" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <p class="sheet-label" id="sheet-label"></p>
    <h2 class="sheet-title" id="sheet-title"></h2>
    <p class="sheet-sub" id="sheet-sub"></p>
    <p class="sheet-hint" id="sheet-hint"></p>
    <div class="sheet-actions" id="sheet-actions"></div>
  </section>
</div>

<script src="rules.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>
</body>
</html>
