<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Routine Tracker</title>
<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#111111" />
</head>
<body>
<main id="app">

  <section class="card">
    <p class="label">Tonight</p>
    <h1 id="tonight-product">—</h1>
    <p class="sub" id="last-active">—</p>

    <div class="actions">
      <button id="btn-used" class="primary">Used it</button>
      <button id="btn-skipped">Skipped / rest night</button>
      <button id="btn-other-toggle">Used something else</button>
    </div>

    <div id="other-choices" class="other-choices hidden">
      <p class="hint">Which one did you actually use?</p>
      <button data-type="used-bha" class="choice">COSRX BHA</button>
      <button data-type="used-retinoid" class="choice">Retinoid</button>
    </div>
  </section>

  <details class="history">
    <summary>History</summary>
    <ul id="history-list"></ul>
  </details>

  <button id="btn-undo" class="undo">Undo last entry</button>

</main>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>
</body>
</html>
